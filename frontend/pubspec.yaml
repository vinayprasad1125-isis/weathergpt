name: weathergpt_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  lucide_icons: ^0.257.0
  http: ^1.1.0
  fl_chart: ^0.68.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: 11.3.1
  geolocator: ^14.0.3
  google_sign_in: ^6.2.1
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/india_states.geojson
    - assets/india_temperature_1901_2025.json
